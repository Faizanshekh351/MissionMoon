[/Script/Engine.RendererSettings]
; ==============================================================================
; HARDWARE RAY TRACING & LUMEN (MAX FIDELITY FOR OFFLINE RENDERS)
; ==============================================================================
r.DynamicGlobalIlluminationMethod=1              ; Lumen
r.ReflectionMethod=1                             ; Lumen
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.LightingMode=2        ; 2 = Full Surface Hit Lighting
r.Lumen.HardwareRayTracing.MaxSurfaceCacheLightingDistance=200000
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.MaxRoughnessToTrace=1.0
r.Lumen.Reflections.DownsampleFactor=1           ; Native resolution reflections
r.Lumen.Reflections.HierarchicalReflect=0
r.Lumen.DiffuseFilter.Quality=1
r.Lumen.ScreenProbeGather.DownsampleFactor=1     ; Full resolution probe gathering
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=64
r.Lumen.ScreenProbeGather.RadianceCache.GridResolution=128
r.LumenScene.SurfaceCache.CardResolution=1024
r.RayTracing=True
r.RayTracing.Reflections=1
r.RayTracing.Reflections.MaxRoughness=1.0
r.RayTracing.Reflections.SamplesPerPixel=8
r.RayTracing.AmbientOcclusion=1
r.RayTracing.AmbientOcclusion.SamplesPerPixel=8

; ==============================================================================
; NANITE SUB-PIXEL GEOMETRY
; ==============================================================================
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=0.25
r.Nanite.ViewMeshLODBias=-2
r.Nanite.Rasterizer.Allow=1

; ==============================================================================
; VIRTUAL SHADOW MAPS (ULTRA SHARP PENUMBRA)
; ==============================================================================
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBias=-2.0
r.Shadow.Virtual.SMRT.SamplesPerPixel=16
r.Shadow.Virtual.SMRT.RayCountDirectional=16
r.Shadow.Virtual.SMRT.RayCountLocal=16

; ==============================================================================
; CINEMATIC POST-PROCESSING & DEPTH OF FIELD
; ==============================================================================
r.DepthOfFieldQuality=4
r.MotionBlurQuality=4
r.MotionBlurSeparable=1
r.BloomQuality=5
r.Tonemapper.Quality=5
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=1           ; Auto Exposure Manual / Histogram

; ==============================================================================
; TRANSLUCENCY & VOLUMETRICS
; ==============================================================================
r.SeparateTranslucency=1
r.TranslucencyLightingVolumeDim=128
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSliceCount=256
